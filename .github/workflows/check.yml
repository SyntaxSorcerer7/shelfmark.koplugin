name: Plugin checks
on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install LuaJIT
        run: sudo apt-get update && sudo apt-get install -y luajit
      - name: Run smoke tests
        run: luajit tests/smoke.lua
      - name: Build and check plugin archive
        run: python3 -m zipfile -t "$(python3 tools/package.py)"
