name: Plugin checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install LuaJIT
        run: sudo apt-get update && sudo apt-get install -y luajit
      - name: Run smoke tests
        run: luajit tests/smoke.lua
      - name: Build plugin archive
        run: python3 tools/package.py
      - name: Check archive
        run: python3 -m zipfile -t dist/shelfmark.koplugin-v0.1.0.zip
